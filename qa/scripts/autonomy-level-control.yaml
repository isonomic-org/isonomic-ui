component: autonomy-level-control
steps:
  - name: picking Run freely moves risky actions to Goes ahead
    check: C4
    click: {at: [345, 108]}
    expect: [{changed: true}, {text: "Run freely"}]
    shot: run-freely
  - name: locking an action moves it to Stops for a yes
    check: C4
    click: {contains: "Stop every time before: Draf"}
    expect: [{changed: true}]
    shot: locked
  - name: Right on the level selector moves the level
    check: C6
    click: {name: "Ask every time"}
  - name: right
    check: C6
    key: Right
    expect: [{changed: true}, {focused: "levels"}]
