component: variant-comparison-card
steps:
  - name: pressing a variant picks it and offers Go with
    check: C4
    click: {at: [200, 172]}
    expect: [{text: "Go with B"}, {text: "Picked due-date"}]
    shot: picked
  - name: Go with runs the action
    check: C4
    click: {contains: "Go with"}
    expect: [{text: "Going with due-date"}]
  - name: pressing the picked variant takes it back
    check: C4
    click: {at: [200, 172]}
    expect: [{text: "Pick taken back"}]
  - name: the metric switch shows Days to pay with lower is better
    check: C4
    click: {at: [500, 97]}
    expect: [{text: "Days to pay"}]
    shot: days-to-pay
  - name: the head folds the card
    check: C4
    click: {at: [200, 60]}
    expect: [{no_text: "Plain reminder"}]
    shot: closed
