component: base-sidebar
steps:
  - name: a focusable row takes the keyboard when pressed
    check: C6
    click: {name: "Search", role: "tree item"}
    expect: [{focused: "chat-row-search"}]
  - name: Down moves to the next row
    check: C6
    key: Down
    expect: [{changed: true}, {focused: true}]
    shot: row-focus
  - name: Up moves back
    check: C6
    key: Up
    expect: [{changed: true}, {focused: "chat-row-search"}]
  - name: the Pinned group folds from its label
    check: C4
    click: {name: "Pinned", role: "push button"}
    expect: [{absent: {name: "March close checklist"}}]
    shot: folded
  - name: and opens again with Enter
    check: C6
    key: Return
    expect: [{present: {name: "March close checklist"}}]
