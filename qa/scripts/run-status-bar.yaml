component: run-status-bar
# The working bar's clock and spinner never rest, so a short settle keeps steps quick.
settle: 0.8
steps:
  - name: every state says what it is in words
    check: C4
    expect:
      - {present: {contains: "Working"}}
      - {present: {contains: "You stopped this response"}}
      - {present: {contains: "Something went wrong."}}
      - {present: {contains: "Done"}}
      - {present: {contains: "The answer was cut short."}}
      - {present: {contains: "Reconnecting"}}
      - {present: {contains: "This chat is closed."}}
  - name: each state carries the buttons the owner passed
    check: C5
    expect:
      - {present: {name: "Steer", role: "push button"}}
      - {present: {name: "Stop", role: "push button"}}
      - {present: {name: "Dismiss", role: "push button"}}
      - {present: {name: "Resume", role: "push button"}}
      - {present: {name: "Continue", role: "push button"}}
      - {text: "Nothing pressed yet"}
  - name: a passed button runs its handler
    check: C4
    click: {name: "Resume"}
    expect: [{text: "Resume pressed"}]
    shot: resume
  - name: Stop on the working bar runs its handler
    check: C4
    click: {name: "Stop"}
    expect: [{text: "Stop pressed"}]
  - name: the shorthand Continue shows as working
    check: C4
    click: {name: "Continue"}
    expect: [{text: "Continu"}]
    shot: continuing
  - name: and settles
    check: C4
    wait: 2
    expect: [{text: "Continued"}]
  - name: the shorthand Try again runs
    check: C4
    click: {name: "Try again"}
    expect: [{changed: true}]
  - name: and settles
    check: C4
    wait: 2
    expect: [{text: "Tried again"}]
  - name: the buttons are reachable by keyboard, in order
    check: C6
    tabstart: true
    expect: [{focused: "button-0"}]
  - name: Enter presses the focused button
    check: C6
    key: Return
    expect: [{text: "Steer pressed"}]
