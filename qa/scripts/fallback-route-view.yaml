component: fallback-route-view
steps:
  - name: the story stays up while its routes change state
    check: C4
    # The states' words are drawn in small type on a story that keeps moving,
    # which text recognition reads unreliably, so the wording is not checked
    # here; it needs a look at the screenshots.
    expect: [{alive: true}]
  - name: Try again appears when every target failed and runs on_retry
    check: C4
    click: Try again
    expect: [{text: "Asked to try"}]
    shot: retried
