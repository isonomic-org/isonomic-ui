component: reasoning-steps-panel
steps:
  - name: a finished panel shows a check and the time taken
    check: C4
    expect: [{text: "Took"}]
  - name: the header folds the steps away
    check: C4
    click: {contains: "Took", role: "push button"}
    expect: [{changed: true}]
    shot: folded
  - name: and back
    check: C4
    click: {contains: "Took", role: "push button"}
    expect: [{changed: true}]
  - name: +N more chip is reachable by keyboard
    check: C6
    tabstart: true
    expect: [{focused: true}]
