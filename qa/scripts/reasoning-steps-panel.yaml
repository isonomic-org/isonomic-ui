component: reasoning-steps-panel
steps:
  - name: a finished panel shows a check and the time taken
    check: C4
    expect: [{text: "Took"}]
  - name: the header folds the steps away
    check: C4
    click: {name: "Took 5s"}
    expect: [{changed: true}, {absent: {name: "Show 2 more sources"}}]
    shot: folded
  - name: and back
    check: C4
    click: {name: "Took 5s"}
    expect: [{changed: true}, {present: {name: "Show 2 more sources"}}]
  - name: +N more chip is reachable by keyboard
    check: C6
    tabstart: true
    expect: [{focused: true}]
