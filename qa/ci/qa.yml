# QA for isonomic-ui component stories.
#
# - Every pull request that touches crates/: build the QA gallery, render the
#   changed stories in light and dark at 360/960/1440 px, play their scripts,
#   compare with the approved baselines, upload everything as an artifact,
#   push the screenshots to the qa-evidence branch, and post or update one QA
#   comment on the pull request.
# - Nightly and on demand: retest every open QA issue on Linux, and build and
#   smoke-launch every story on macOS.
#
# The QA gallery and runner live in the separate qa/ workspace and are never
# part of a release build.
name: QA

on:
  pull_request:
    paths: ["crates/**", "qa/**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write        # push screenshots to the qa-evidence branch
  pull-requests: write   # post and update the QA comment
  issues: write          # retest comments and the qa:verified label

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Branch the nightly integration build starts from. Switch it to the
  # foundation branch once the component pull requests move onto it.
  QA_INTEGRATION_BASE: extra/scaffold
  QA_DISPLAY: ":99"

jobs:
  stories:
    name: Stories (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox xdotool imagemagick tesseract-ocr \
            dbus at-spi2-core python3-pyatspi python3-yaml python3-pil \
            mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 libxcb1 libx11-xcb1 \
            libfontconfig1 libfreetype6 libwayland-client0 libasound2t64

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            qa/target
          key: qa-${{ runner.os }}-${{ hashFiles('qa/Cargo.toml', 'qa/*/Cargo.toml', 'crates/*/Cargo.toml') }}
          restore-keys: qa-${{ runner.os }}-

      - name: Changed stories
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          slugs=$(git diff --name-only "$base"...HEAD -- crates/extra/src crates/gallery/src/stories/extra \
            | sed -n 's#.*/\([a-z0-9_]*\)\.rs$#\1#p' | grep -v -e '^lib$' -e '^common$' -e '^mod$' \
            | tr '_' '-' | sort -u | tr '\n' ' ')
          if git diff --name-only "$base"...HEAD | grep -q -e '^crates/extra/src/common.rs' -e '^qa/'; then
            slugs="--all"
          fi
          # The QA gallery is built against the pre-foundation layout (crates/extra on the
          # published base crates). On the foundation layout (crates/ui present) it does not
          # build yet, so skip rather than post a false C1 failure on the pull request.
          if [ -f crates/ui/Cargo.toml ] && ! grep -q '^isonomic-ui' qa/gallery/Cargo.toml; then
            echo "::notice::Foundation layout: the QA gallery has not been ported to it yet, so no QA run."
            slugs=""
          fi
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Stories to test: ${slugs:-none}"

      - name: Build the QA gallery
        if: steps.changed.outputs.slugs != ''
        working-directory: qa
        run: cargo build -p qa-gallery -p qa-runner

      - name: Render and script the stories
        if: steps.changed.outputs.slugs != ''
        working-directory: qa
        env:
          QA_PYTHON: /usr/bin/python3
        run: |
          Xvfb :99 -screen 0 1600x2600x24 -nolisten tcp &
          sleep 1
          # C1-C10: the runner's exit code is informational; the comment carries the verdict.
          cargo run -q -p qa-runner -- run ${{ steps.changed.outputs.slugs }} || true

      - name: Code health (C11)
        if: steps.changed.outputs.slugs != ''
        working-directory: qa
        run: /usr/bin/python3 -I runner/driver/code_health.py || true

      - name: Compare with baselines
        if: steps.changed.outputs.slugs != ''
        run: |
          if git fetch origin qa-evidence:qa-evidence 2>/dev/null; then
            git worktree add /tmp/evidence qa-evidence
            /usr/bin/python3 -I qa/report/visual_diff.py --run qa/out --baselines /tmp/evidence/baselines
          fi

      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.slugs != ''
        with:
          name: qa-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: qa/out
          retention-days: 30

      - name: Push screenshots to qa-evidence
        if: steps.changed.outputs.slugs != '' && github.event.pull_request.head.repo.full_name == github.repository
        id: evidence
        run: |
          set -e
          sha="${{ github.event.pull_request.head.sha }}"
          dir="runs/pr-${{ github.event.pull_request.number }}/${sha:0:10}"
          if [ ! -d /tmp/evidence ]; then
            git worktree add --orphan -b qa-evidence /tmp/evidence 2>/dev/null || git worktree add /tmp/evidence qa-evidence
          fi
          mkdir -p "/tmp/evidence/$dir"
          for d in qa/out/*/; do
            slug=$(basename "$d")
            mkdir -p "/tmp/evidence/$dir/$slug"
            cp "$d"shots/*.png "/tmp/evidence/$dir/$slug/" 2>/dev/null || true
            cp "$d"contact.png "/tmp/evidence/$dir/$slug/" 2>/dev/null || true
            cp "$d"diff-*.png "/tmp/evidence/$dir/$slug/" 2>/dev/null || true
          done
          cd /tmp/evidence
          git config user.name "Omar Qadmiri"
          git config user.email "omar@isonomic.com"
          git add -A
          git commit -q -m "QA evidence for #${{ github.event.pull_request.number }} at ${sha:0:10}" || true
          git push -q origin HEAD:qa-evidence
          echo "url=https://github.com/${{ github.repository }}/blob/qa-evidence/$dir" >> "$GITHUB_OUTPUT"

      - name: Write the QA comment
        if: steps.changed.outputs.slugs != ''
        run: |
          /usr/bin/python3 -I qa/report/ci_comment.py --run qa/out \
            --pr "${{ github.event.pull_request.number }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --evidence-url "${{ steps.evidence.outputs.url }}" \
            --issues qa/review/issues.json > /tmp/qa-comment.md

      - name: Post or update the QA comment
        if: steps.changed.outputs.slugs != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/qa-comment.md', 'utf8');
            const marker = '<!-- isonomic-qa-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  retest:
    name: Retest open QA issues (Linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox xdotool imagemagick tesseract-ocr \
            dbus at-spi2-core python3-pyatspi python3-yaml python3-pil \
            mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 libxcb1 libx11-xcb1 \
            libfontconfig1 libfreetype6 libwayland-client0 libasound2t64
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            qa/target
          key: qa-${{ runner.os }}-${{ hashFiles('qa/Cargo.toml', 'qa/*/Cargo.toml', 'crates/*/Cargo.toml') }}
          restore-keys: qa-${{ runner.os }}-
      - name: Integration build of every open component branch
        run: |
          git fetch -q origin 'refs/heads/extra/*:refs/remotes/origin/extra/*'
          git config user.name "Omar Qadmiri"
          git config user.email "omar@isonomic.com"
          git fetch -q origin "$QA_INTEGRATION_BASE"
          git checkout -q -B qa/integration FETCH_HEAD
          open=$(gh pr list --state open --json headRefName -q '.[].headRefName' | grep '^extra/' | grep -v '^extra/scaffold$')
          for b in $open; do git merge -q --no-edit "origin/$b" || { echo "conflict merging $b"; git merge --abort; }; done
          git checkout -q origin/${{ github.event.repository.default_branch }} -- qa
          echo "INTEGRATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ -f crates/ui/Cargo.toml ] && ! grep -q '^isonomic-ui' qa/gallery/Cargo.toml; then
            echo "::error::Foundation layout: the QA gallery has not been ported to it yet."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retest
        working-directory: qa
        env:
          QA_PYTHON: /usr/bin/python3
        run: |
          Xvfb :99 -screen 0 1600x2600x24 -nolisten tcp &
          sleep 1
          cargo build -p qa-gallery
          /usr/bin/python3 -I runner/retest.py --issues review/issues.json --out out-retest --sha "$INTEGRATION_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: qa-retest-${{ github.run_id }}
          path: qa/out-retest
      - name: Mark verified fixes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('qa/out-retest/retest.json', 'utf8'));
            const { owner, repo } = context.repo;
            for (const r of results.filter(r => r.result === 'fixed')) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: r.number });
              if (issue.labels.some(l => (l.name || l) === 'qa:verified')) continue;
              await github.rest.issues.createComment({ owner, repo, issue_number: r.number,
                body: `Verified fixed at ${process.env.INTEGRATION_SHA} (QA retest, ${r.check}).` });
              await github.rest.issues.addLabels({ owner, repo, issue_number: r.number, labels: ['qa:verified'] });
            }

  macos:
    name: Stories smoke test (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            qa/target
          key: qa-${{ runner.os }}-${{ hashFiles('qa/Cargo.toml', 'qa/*/Cargo.toml', 'crates/*/Cargo.toml') }}
          restore-keys: qa-${{ runner.os }}-
      - name: Integration build of every open component branch
        run: |
          git fetch -q origin 'refs/heads/extra/*:refs/remotes/origin/extra/*'
          git config user.name "Omar Qadmiri"
          git config user.email "omar@isonomic.com"
          git fetch -q origin "$QA_INTEGRATION_BASE"
          git checkout -q -B qa/integration FETCH_HEAD
          open=$(gh pr list --state open --json headRefName -q '.[].headRefName' | grep '^extra/' | grep -v '^extra/scaffold$')
          for b in $open; do git merge -q --no-edit "origin/$b" || { echo "conflict merging $b"; git merge --abort; }; done
          git checkout -q origin/${{ github.event.repository.default_branch }} -- qa
          echo "INTEGRATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ -f crates/ui/Cargo.toml ] && ! grep -q '^isonomic-ui' qa/gallery/Cargo.toml; then
            echo "::error::Foundation layout: the QA gallery has not been ported to it yet."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build the QA gallery for macOS
        working-directory: qa
        run: |
          # The workspace pins the x11 backend for Linux; macOS uses the platform default.
          sed -i '' 's/default-features = false, features = \["x11"\]//' Cargo.toml
          cargo build -p qa-gallery
      - name: Launch every story and check it stays up
        working-directory: qa
        run: |
          status=0
          for s in $(./target/debug/qa-gallery --list); do
            ./target/debug/qa-gallery --story "$s" > "/tmp/$s.log" 2>&1 &
            pid=$!
            sleep 6
            if kill -0 $pid 2>/dev/null; then
              screencapture -x "/tmp/$s.png" || true
              kill $pid
              echo "ok   $s"
            else
              echo "FAIL $s exited early"; cat "/tmp/$s.log"; status=1
            fi
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-macos-${{ github.run_id }}
          path: /tmp/*.png
