# Confirmed defects with their full reproduction notes, as filed on GitHub by the QA session.
# Each was reproduced in a fresh gallery window before filing.

- id: permission-prompt-enter-on-deny
  slug: permission-prompt
  title: "Permission prompt: Enter on a focused Deny button allows the request"
  sev: 1
  kind: keyboard
  check: C6
  step: 3
  expected_bullet: 4
  expected_note: "Enter is meant to allow with the picked choice, but a focused Deny button has its own Enter: pressing it must deny."
  actual: |
    With keyboard focus on **Deny** (the focus ring is drawn on Deny; the focused element is `reminders/deny`), pressing Enter **allows** the request: the prompt folds to "Allowed for 2 minutes" and `on_decide` reports an allow ("Reminders allowed" in the story). A keyboard user who deliberately moves to Deny and presses Enter grants the permission instead of refusing it.
  cause: |
    The prompt's card-level `on_key_down` maps `enter` to allow and runs for key events that bubble up from the buttons inside it, so it fires for Enter on the focused Deny button. It should leave Enter alone when a button (or any other control) inside the prompt has focus, or only act when the prompt itself is the focused element.
  repro:
    - Open the story (`cargo run -p qa-gallery -- --story permission-prompt`).
    - Press Tab until Deny in the first prompt ("Collections assistant wants to send 14 reminders") has the focus ring (the second Tab stop).
    - Press Enter.
  shots: [enter-on-deny]
  why_sev: "Sev1: the control does the opposite of what the person chose, and the action it grants is a permission."

- id: autonomy-level-control-levels-not-tab-stop
  slug: autonomy-level-control
  title: "Autonomy level control: the level selector cannot be reached with Tab"
  sev: 2
  kind: keyboard
  check: C6
  step: 3
  expected_bullet: 1
  actual: |
    The window has 6 Tab stops, all of them lock buttons. Tab goes lock 1 → lock 6 → back to lock 1 and never lands on the three levels, so Left/Right/Home/End can never be used and the level cannot be changed without a pointer.
  cause: |
    The level group tracks a `FocusHandle` but the handle is not a Tab stop (`cx.focus_handle()` without `.tab_stop(true)`), so it is focusable only from code.
  repro:
    - Open the story and press Tab repeatedly.
    - Watch the focus ring: it visits only the six Lock buttons.
  shots: []

- id: filter-menu-list-not-tab-stop
  slug: filter-menu
  title: "Filter menu: the option list cannot be reached with Tab"
  sev: 2
  kind: keyboard
  check: C6
  step: 4
  expected_bullet: 4
  actual: |
    The story has 4 Tab stops: Clear all and the three chip remove buttons. Tab cycles through those and never reaches the groups and options, so Up/Down/Enter/Left/Right cannot be used and filters cannot be picked from the keyboard.
  cause: |
    The list's `FocusHandle` is not a Tab stop (`cx.focus_handle()` without `.tab_stop(true)`).
  repro:
    - Open the story and press Tab repeatedly.
    - Focus only visits Clear all and the chip remove buttons.
  shots: [keyboard]

- id: metric-trend-card-plot-not-tab-stop
  slug: metric-trend-card
  title: "Metric trend card: the plot cannot be reached with Tab"
  sev: 2
  kind: keyboard
  check: C6
  step: 4
  expected_bullet: 4
  actual: |
    The story has no Tab stops at all. Tab does nothing, so the readout can only be opened with a pointer; Left/Right/Home/End/Escape on the plot are unreachable.
  cause: |
    The plot's `FocusHandle` is created with `cx.focus_handle()` and never made a Tab stop.
  repro:
    - Open the story, press Tab.
    - Nothing gets focus and the readout stays where `default_point` put it.
  shots: []

- id: approval-card-buttons-unnamed
  slug: approval-card
  title: "Approval card: Approve and Deny have no accessible name"
  sev: 2
  kind: a11y
  check: C9
  expected_note: "C9: every control has a role and a name; a screen reader user must be able to tell Approve from Deny."
  actual: |
    In the accessibility tree the four decision buttons (`reminders/deny`, `reminders/approve`, `void/deny`, `void/approve`) are buttons with no label, and over AT-SPI they are push buttons with an empty name. A screen reader announces both as "button", so the person cannot tell which one approves.
  cause: |
    The buttons are built from a pressable with child elements (the text plus a key hint), so no label is set. Set `accessibility_label` to the visible text ("Approve", "Deny", or the custom approve label).
  repro:
    - Open the story with an accessibility client running and read the buttons in the footer.
  shots: []

