[package]
name = "isonomic-ui-assets"
edition.workspace = true
license = "Apache-2.0"
publish = false
version = "0.1.0"

links = "isonomic-ui-default-icons"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui-fast = { workspace = true, optional = true }
log.workspace = true

[dev-dependencies]
gpui_platform.workspace = true
gpui-fast-platform.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
gpui-fast = ["dep:gpui-fast"]
