name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit
    with:
      # The toolchain the code is formatted and linted with. 1.98 is the
      # oldest that builds the macOS backend; the code is formatted the same
      # under 1.97 and 1.98, while newer rustfmt lays out some macro
      # arguments differently.
      toolchain: "1.98"
      # Default features plus the test hooks. `gpui-fast` swaps in the other
      # GPUI backend, so --all-features would run the suite on the wrong one.
      features: --features isonomic-ui-component/test-support,isonomic-ui-base/test-support
      linux-gui-libs: true
      # The gallery opens native file dialogs through GTK on Linux.
      apt-packages: libgtk-3-dev
      # Some existing files exceed 20 KB; new files still keep to 20 KB.
      max-file-bytes: 1048576
